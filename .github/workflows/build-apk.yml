
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find ZIP
        run: |
          ZIP_FILE=$(find . -type f -iname '*.zip' -not -path './.git/*' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP file not found in repository"
            exit 1
          fi
          echo "ZIP_FILE=$ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> $GITHUB_ENV

      - name: Extract project
        run: |
          mkdir project
          unzip -q "$ZIP_FILE" -d project
          PROJECT_DIR=$(find project -name settings.gradle.kts -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/dist/"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DailyQuoteWidget-APK
          path: dist/*.apk

